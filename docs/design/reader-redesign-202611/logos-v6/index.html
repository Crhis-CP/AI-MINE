<h1>少一些方块，多一些曲线：同一个“山”，三种写法</h1>
<p class="lead">保留你认可的核心：整体像一个“山”字，底部是地层，顶上一颗亮点代表 AI，配色沿用深金、中金、浅金的比例。这一版只用平滑的曲线和圆角，向主流 AI 产品图标学习“舒服、耐看、过目不忘”。</p></header>
<section class="heroes"><figure><span class=rec>推荐</span><img src="peaks-icon-hero.svg" alt="三峰"><span class="en">Three Peaks</span><h2>三峰</h2><p>三座平滑的峰，中间最高，也是一个“山”字；峰的曲线正好是数据里的钟形分布，悄悄接上 AI。山脚是地层，顶上一颗亮点。</p></figure><figure><img src="pillars-icon-hero.svg" alt="山柱"><span class="en">Pillars</span><h2>山柱</h2><p>三根圆角柱，矮、高、矮，组成一个“山”字，从波浪地层里升起。它们像山峰，像金锭，也像数据柱。中间最高那根顶上悬着 AI 亮点。</p></figure><figure><img src="layered-icon-hero.svg" alt="层峦"><span class="en">Layered Peak</span><h2>层峦</h2><p>一座线条圆润的山，被两道弧形地层线分成深金、中金、浅金三层，山顶悬着一颗亮点，代表 AI。山是矿，层是历史，光是未来。整个图形只有一座山和一个点。</p></figure></section>
