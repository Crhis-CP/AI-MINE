<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI矿策 · 方向 C 勘探图</title>
<style>
/* Direction C "Survey": a field-survey sheet. Contour lines drift in the header, the home page opens on a dot map
   of where today's stories happen, stories are grouped by region, and lifecycle steps are survey benchmarks. */
@font-face { font-family: "Barlow"; src: url("../shared/fonts/Barlow_400Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Barlow"; src: url("../shared/fonts/Barlow_600SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("../shared/fonts/BarlowCondensed_500Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("../shared/fonts/BarlowCondensed_600SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }

:root {
  /* survey sheet: cool paper, blue-black ink, stake orange, topographic olive, contour brown */
  --paper: #F4F6F6; --surface: #FFFFFF; --sunk: #EBEFF0; --ink: #17232D; --muted: #52616C; --line: #D7DEE1;
  --stake: #E8590C; --stake-ink: #9E3907; --olive: #4F5F22; --olive-fill: #8A9A4B; --contour: #C8B191; --sea: #E3ECEF; --land: #9AA9B1;
  --hi: #B42318; --lo: #7A8790; --focus: #1F5FBF;
  --sans: "Barlow", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --label: "Barlow Condensed", "Barlow", "PingFang SC", "Noto Sans SC", sans-serif;
  --serif: "Songti SC", "Noto Serif SC", serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1519; --surface: #162026; --sunk: #1C272E; --ink: #E5EBED; --muted: #9AA8B0; --line: #26323A;
  --stake: #FF7A33; --stake-ink: #FF9B63; --olive: #BCCB80; --olive-fill: #8A9A4B; --contour: #5A4835; --sea: #131D23; --land: #4B5A63;
  --hi: #FF7468; --lo: #74838C; --focus: #7FB0FF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F1519; --surface: #162026; --sunk: #1C272E; --ink: #E5EBED; --muted: #9AA8B0; --line: #26323A;
  --stake: #FF7A33; --stake-ink: #FF9B63; --olive: #BCCB80; --olive-fill: #8A9A4B; --contour: #5A4835; --sea: #131D23; --land: #4B5A63;
  --hi: #FF7468; --lo: #74838C; --focus: #7FB0FF; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; } button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 60; } .skip:focus { left: 8px; }
.lab { font-family: var(--label); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; font-size: 12px; color: var(--muted); }
.coord { font-family: var(--label); font-variant-numeric: tabular-nums; letter-spacing: .04em; color: var(--muted); font-size: 13px; }

/* header with drifting contours */
.head { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--surface); }
.contours { position: absolute; inset: 0; width: 200%; height: 100%; animation: drift 90s linear infinite; pointer-events: none; }
.contours path { fill: none; stroke: var(--contour); stroke-width: 1; opacity: .55; }
@keyframes drift { to { transform: translateX(-50%); } }
.head-in { position: relative; display: flex; align-items: center; gap: 22px; max-width: 1280px; margin: 0 auto; padding: 14px max(24px, env(safe-area-inset-right)) 14px max(24px, env(safe-area-inset-left)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand svg { width: 36px; height: 36px; }
.brand b { font-size: 19px; font-weight: 600; letter-spacing: .02em; display: block; line-height: 1.1; }
.brand small { display: block; font: 500 11px/1.2 var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.topnav { display: flex; gap: 2px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.topnav a { white-space: nowrap; display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 15px; }
.topnav a:hover { color: var(--ink); background: var(--sunk); }
.topnav a[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--stake); border-radius: 0; }
.htools { margin-left: auto; display: flex; gap: 8px; flex: none; }
.hbtn { min-height: 40px; min-width: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 13px/1 var(--label); letter-spacing: .08em; display: inline-flex; align-items: center; justify-content: center; }

.page { max-width: 1280px; margin: 0 auto; padding: 24px max(24px, env(safe-area-inset-right)) 48px max(24px, env(safe-area-inset-left)); }
.title-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.title-row h1 { margin: 0; font-size: 30px; line-height: 1.2; font-weight: 600; }
.title-row .upd { color: var(--muted); font-size: 13px; }

/* map + essentials */
.overview { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; margin-bottom: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.mapcard { padding: 16px 16px 12px; display: grid; gap: 10px; align-content: space-between; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.stats div { display: grid; }
.stats b { font: 600 26px/1.1 var(--label); }
.stats span { font-size: 12px; color: var(--muted); }
.mapcard header { display: flex; align-items: baseline; gap: 10px; }
.mapcard h2 { margin: 0; font-size: 16px; }
.map { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--sea); }
.map .grat { stroke: var(--line); stroke-width: .3; fill: none; }
.map .dot { fill: var(--land); }
.map .bub { fill: color-mix(in oklab, var(--olive-fill) 55%, transparent); stroke: var(--olive-fill); stroke-width: .6; transform-box: fill-box; transform-origin: center; animation: drop .6s var(--ease) both; animation-delay: var(--d, 0s); }
.map .bub.focus { fill: color-mix(in oklab, var(--stake) 60%, transparent); stroke: var(--stake); }
.map .ring { fill: none; stroke: var(--stake); stroke-width: .8; transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out 3 both; animation-delay: .8s; }
.map text { font: 600 5.2px/1 var(--label); fill: var(--ink); letter-spacing: .04em; }
.map text.n { font-size: 4.4px; fill: var(--muted); }
@keyframes drop { from { transform: translateY(-6px) scale(.4); opacity: 0; } }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 32px; padding: 0 10px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.legend button b { font: 600 13px/1 var(--label); color: var(--ink); }
.legend button[aria-pressed="true"] { border-color: var(--stake); color: var(--ink); }

.ess { padding: 16px; display: grid; gap: 10px; align-content: start; }
.ess h2 { margin: 0; font-size: 16px; }
.ess ol { list-style: none; margin: 0; padding: 0; display: grid; }
.ess li a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; }
.ess li:first-child a { border-top: 0; }
.ess .no { font: 600 22px/1 var(--label); color: var(--stake-ink); }
.ess .t { font-weight: 600; font-size: 15px; line-height: 1.45; }
.ess .w { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.cc { font: 600 12px/1 var(--label); letter-spacing: .06em; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: var(--muted); }

/* facets */
.facetbar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 20px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.segc { display: inline-grid; grid-auto-flow: column; background: var(--sunk); border-radius: 10px; padding: 3px; }
.segc button { border: 0; background: none; min-height: 36px; padding: 0 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
.segc button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--stake); border-color: var(--stake); color: #1A0E06; font-weight: 600; }

/* region groups */
.region { margin-bottom: 26px; }
.region-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px dashed var(--contour); }
.region-head h2 { margin: 0; font-size: 18px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.story-card { display: grid; gap: 8px; align-content: start; padding: 16px; animation: up .5s var(--ease) both; animation-delay: var(--d, 0s); transition: border-color .2s, transform .2s var(--ease); }
.story-card:hover { border-color: var(--stake); transform: translateY(-2px); }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.loc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.loc svg { width: 12px; height: 12px; flex: none; }
.flag { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.flag b { display: inline-flex; align-items: center; gap: 4px; font: 600 14px/1 var(--label); padding: 4px 8px 4px 6px; border-radius: 4px; background: var(--sunk); }
.flag b::before { content: ""; width: 3px; height: 14px; background: currentColor; border-radius: 1px; }
.flag.hi b { color: var(--hi); } .flag.mid b { color: var(--stake-ink); } .flag.lo b { color: var(--muted); }
.story-card h3 { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 600; text-wrap: balance; }
.story-card h3 a { text-decoration: none; } .story-card h3 a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--stake); }
.orig { display: block; font: 600 11px/1.4 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.story-card p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.tag { padding: 2px 8px; border-radius: 4px; background: var(--sunk); color: var(--ink); font-size: 12px; }
.tag.pick { background: color-mix(in oklab, var(--stake) 18%, transparent); color: var(--stake-ink); font-weight: 600; }
.meta a { margin-left: auto; color: var(--stake-ink); font-weight: 600; text-decoration: none; min-height: 28px; display: inline-flex; align-items: center; }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 8px; }
.box { padding: 16px; }
.box h2 { margin: 0 0 2px; font-size: 16px; } .box .hint { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
table.px { width: 100%; border-collapse: collapse; font-size: 14px; }
table.px th, table.px td { padding: 9px 6px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.px th { font: 600 11px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
table.px td:first-child, table.px th:first-child { text-align: left; }
table.px .v { font: 600 16px/1 var(--label); }
.up { color: var(--hi); } .down { color: var(--muted); }
.cal { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.cal li { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.cal li:first-child { border-top: 0; }
.cal .d { font: 600 18px/1 var(--label); color: var(--stake-ink); }
.foot { max-width: 1280px; margin: 0 auto; padding: 16px max(24px, env(safe-area-inset-right)) 40px max(24px, env(safe-area-inset-left)); display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.foot strong { color: var(--ink); }

/* story */
.progress { position: fixed; left: 0; top: 0; height: 3px; width: 100%; background: var(--stake); transform-origin: left; transform: scaleX(var(--p, 0)); z-index: 50; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; color: var(--muted); text-decoration: none; font-size: 14px; }
.sgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 44px; }
.shead { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: end; padding-bottom: 20px; border-bottom: 1px dashed var(--contour); }
.shead h1 { margin: 6px 0 10px; font-size: 32px; line-height: 1.32; font-weight: 600; text-wrap: balance; view-transition-name: lead-title; }
.inset { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.prose { max-width: 37em; font-size: 18px; line-height: 1.85; }
.prose.serif { font-family: var(--serif); }
.prose h2 { font-size: 18px; margin: 34px 0 14px; font-family: var(--sans); font-weight: 600; }
.traverse { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; font-size: 16px; line-height: 1.6; }
.traverse li { display: grid; grid-template-columns: 26px 64px 1fr; gap: 10px; padding: 0 0 18px; position: relative; }
.traverse li::before { content: ""; position: absolute; left: 12px; top: 18px; bottom: 0; border-left: 1.5px dashed var(--contour); }
.traverse li:last-child::before { display: none; }
.traverse .tri { width: 26px; height: 22px; }
.traverse .d { font: 600 15px/1.5 var(--label); color: var(--muted); }
.traverse .added .d { color: var(--stake-ink); }
.traverse .k { font-size: 12px; font-weight: 600; color: var(--stake-ink); margin-left: 6px; }
table.rep { width: 100%; border-collapse: collapse; font-size: 15px; font-family: var(--sans); }
table.rep th, table.rep td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.rep th { font: 600 11px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
table.rep .added { color: var(--stake-ink); font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; background: var(--stake); color: #1A0E06; text-decoration: none; font: 600 15px/1 var(--sans); border: 0; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.ainote { font-size: 13px; color: var(--muted); padding: 10px 12px; border-radius: 8px; background: var(--sunk); margin: 24px 0; }
.sticky { position: sticky; top: 20px; display: grid; gap: 16px; align-content: start; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; font-size: 14px; }
.toc a { display: block; padding: 8px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--muted); } .toc li:first-child a { border-top: 0; }
.toc a:hover { color: var(--ink); }

/* policy */
.status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; background: color-mix(in oklab, var(--olive-fill) 22%, transparent); color: var(--olive); font-weight: 600; font-size: 13px; }
.bench { position: relative; margin: 24px 0 8px; padding: 18px 16px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.bench svg.line { position: absolute; left: 0; right: 0; top: 30px; width: 100%; height: 20px; }
.bench ol { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.bench li { display: grid; justify-items: center; text-align: center; gap: 6px; animation: up .5s var(--ease) both; animation-delay: var(--d, 0s); }
.bench .tri { width: 30px; height: 26px; }
.bench .d { font: 600 15px/1 var(--label); color: var(--muted); }
.bench .l { font-size: 14px; line-height: 1.45; }
.bench .cur .l { font-weight: 700; } .bench .cur .d { color: var(--stake-ink); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 18px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.kv div { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kv div:nth-child(3n) { border-right: 0; } .kv div:nth-last-child(-n+3) { border-bottom: 0; }
.kv dt { font: 600 11px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; } .kv dd { margin: 0; font-weight: 600; }
.cmpw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.cmp { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 15px; line-height: 1.65; }
.cmp th, .cmp td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp thead th { font: 600 11px/1.4 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
.cmp tr:last-child td { border-bottom: 0; }
.cmp td:first-child { font-weight: 600; width: 22%; }
.cmp .add { border-bottom: 2px solid color-mix(in oklab, var(--stake) 55%, transparent); }
.notice { margin-top: 18px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--stake); background: var(--surface); display: grid; gap: 6px; font-size: 14px; }

.proto { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40; display: flex; gap: 4px; align-items: center; padding: 5px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 12px; box-shadow: 0 10px 28px -10px rgb(0 0 0 / .45); }
.proto span { padding: 0 8px; opacity: .8; }
.proto button { border: 0; background: transparent; color: inherit; min-height: 32px; padding: 0 10px; border-radius: 7px; cursor: pointer; }
.proto button[aria-pressed="true"] { background: var(--stake); color: #1A0E06; }

.tabbar { display: none; }
@media (max-width: 1080px) { .topnav { display: none; } .overview, .lower { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .head-in { padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); gap: 10px; }
  .brand small { display: none; } .brand svg { width: 30px; height: 30px; }
  .page { padding: 16px max(16px, env(safe-area-inset-right)) 100px max(16px, env(safe-area-inset-left)); }
  .title-row h1 { font-size: 24px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .facetbar { grid-template-columns: minmax(0, 1fr); }
  .segc { overflow-x: auto; }
  .sgrid, .shead { grid-template-columns: minmax(0, 1fr); gap: 20px; } .shead h1 { font-size: 24px; } .sticky { position: static; }
  .prose { font-size: 17px; }
  .bench ol { grid-template-columns: minmax(0, 1fr); } .bench svg.line { display: none; }
  .bench li { grid-template-columns: 30px 90px 1fr; justify-items: start; text-align: left; align-items: center; }
  .kv { grid-template-columns: 1fr 1fr; } .kv div { border-right: 1px solid var(--line) !important; border-bottom: 1px solid var(--line) !important; } .kv div:nth-child(2n) { border-right: 0 !important; }
  .flag > span { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; min-height: 48px; padding-top: 6px; font-size: 11px; color: var(--muted); text-decoration: none; }
  .tabbar a[aria-current="page"] { color: var(--stake-ink); font-weight: 600; }
  .tabbar svg { width: 20px; height: 20px; }
  .proto { bottom: calc(76px + env(safe-area-inset-bottom)); } .proto span { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>

  const mark = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0B0F12"/><g transform="translate(8 8)"><defs><clipPath id="mt-cengluan-gold-dark"><path d="M4 42.5 C10.6 38.8 14.6 31.4 17.8 25.2 C20.1 20.7 21.7 14.6 23.1 12.6 Q24 11.4 24.9 12.6 C26.3 14.6 27.9 20.7 30.2 25.2 C33.4 31.4 37.4 38.8 44 42.5 Z"/></clipPath></defs><g clip-path="url(#mt-cengluan-gold-dark)"><rect width="48" height="48" fill="#E9C66A"/><path d="M0 26.6 C10 24.9 16 28.7 24 27.1 C32 25.5 38 28.9 48 27.2 V48 H0 Z" fill="#C8992E"/><path d="M0 34.9 C9 33.5 16 36.7 24 35.3 C32 33.9 39 36.9 48 35.3 V48 H0 Z" fill="#9C7114"/><g fill="none" stroke="#0B0F12" stroke-width="1.5"><path d="M0 26.6 C10 24.9 16 28.7 24 27.1 C32 25.5 38 28.9 48 27.2"/><path d="M0 34.9 C9 33.5 16 36.7 24 35.3 C32 33.9 39 36.9 48 35.3"/></g><circle cx="24" cy="30.6" r="5.300000000000001" fill="#FFF1C4" opacity=".22"/><circle cx="24" cy="30.6" r="3.1" fill="#FFF1C4"/></g></g></svg>`;

  const t = () => P.t();

  // Rough continent outlines (lon, lat), only used to place the dot matrix.
  const LAND = [
    [[-168,66],[-156,71],[-140,70],[-120,74],[-95,75],[-80,72],[-62,60],[-55,52],[-66,45],[-75,38],[-81,31],[-81,25],[-90,29],[-97,26],[-97,20],[-87,21],[-83,10],[-78,8],[-90,14],[-105,20],[-112,30],[-118,34],[-124,40],[-124,48],[-135,58],[-150,60],[-165,60]],
    [[-55,60],[-44,60],[-20,70],[-20,80],[-60,82],[-70,77]],
    [[-80,8],[-72,12],[-60,10],[-50,0],[-35,-5],[-38,-14],[-40,-22],[-48,-27],[-58,-35],[-65,-42],[-68,-52],[-74,-52],[-73,-40],[-71,-30],[-70,-18],[-76,-14],[-81,-5],[-79,2]],
    [[-10,36],[-9,43],[-2,44],[-5,48],[2,51],[8,54],[5,58],[10,63],[20,70],[30,70],[40,67],[45,55],[40,45],[28,41],[22,37],[12,38],[3,42]],
    [[-6,50],[2,51],[0,58],[-6,58]],
    [[-17,21],[-16,12],[-8,5],[5,4],[9,4],[10,-2],[12,-8],[14,-20],[18,-34],[26,-34],[32,-28],[35,-20],[40,-15],[40,-5],[43,0],[51,11],[43,12],[37,18],[33,30],[25,32],[10,37],[-6,36],[-10,30]],
    [[26,40],[36,36],[35,30],[43,13],[52,16],[57,22],[60,25],[67,24],[72,20],[77,8],[80,15],[88,22],[92,21],[98,16],[100,7],[104,1],[106,10],[109,12],[108,21],[117,23],[122,30],[121,40],[129,35],[130,42],[140,46],[142,53],[160,60],[170,65],[180,68],[180,72],[140,73],[110,77],[80,73],[60,70],[45,68],[40,60],[45,45],[40,42]],
    [[95,5],[100,2],[106,-6],[115,-8],[125,-9],[134,-5],[141,-3],[141,-8],[125,-10],[105,-8],[95,0]],
    [[114,-22],[122,-17],[130,-12],[137,-12],[142,-11],[146,-19],[153,-25],[151,-34],[145,-38],[138,-35],[130,-32],[115,-34],[113,-26]],
    [[44,-25],[50,-15],[49,-12],[43,-17]]
  ];
  const inside = (x, y, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  let dotCache = null;
  function dots() {
    if (dotCache) return dotCache;
    let s = "";
    for (let lat = 78; lat >= -56; lat -= 3) for (let lon = -168; lon <= 180; lon += 3) if (LAND.some((p) => inside(lon, lat, p))) s += `<circle class="dot" cx="${lon + 180}" cy="${80 - lat}" r=".85"/>`;
    return (dotCache = s);
  }
  function map(focusCode) {
    let grat = "";
    for (let lon = -150; lon <= 180; lon += 30) grat += `<path class="grat" d="M${lon + 180} 0V140"/>`;
    for (let lat = 60; lat >= -60; lat -= 30) grat += `<path class="grat" d="M0 ${80 - lat}H360"/>`;
    const bubbles = D.countries.map((c, i) => {
      const r = 2.2 + c.n * 0.42, x = c.lon + 180, y = 80 - c.lat, f = c.code === focusCode;

        ${(c.n >= 7 || f) ? `<text x="${x + r + 1.5}" y="${y + 1.8}">${c.code}</text><text class="n" x="${x + r + 1.5}" y="${y + 6.5}">${c.n}</text>` : ""}`;

    return `<svg class="map" viewBox="0 0 360 140" role="img" aria-label="${t().map}">${grat}${dots()}${bubbles}</svg>`;
  }
  function contours() {
    let d = "";
    for (let k = 0; k < 7; k++) {

      let p = `M0 ${y}`;
      for (let x = 0; x <= 2880; x += 120) p += ` Q ${x + 60} ${y + (((x / 120) + k) % 2 ? a : -a)} ${x + 120} ${y}`;

  }

  function head(screen) {

  function frame(inner, screen) {

      <footer class="foot"><strong>${tt.brand}</strong><span>${P.pick(D.updated)}</span><span>${tt.footer.attribution}</span><a href="#home">${tt.footer.takedown}</a><span>${tt.footer.demo}</span></footer>

  const REGIONS = [

  function home() {

    let k = 0;
    const groups = REGIONS.map((r) => {
      const list = D.items.filter((it) => r.codes.includes(it.country)); if (!list.length) return "";

      </div>`, "policy");

  const root = document.getElementById("root");
  function render() { const s = P.state.screen; root.innerHTML = s === "story" ? story() : s === "policy" ? policy() : home(); document.documentElement.lang = P.state.lang === "zh" ? "zh-CN" : "en"; }
  const nav = (fn) => (document.startViewTransition && !P.reduced ? document.startViewTransition(fn) : fn());

    const el = e.target.closest("[data-go],[data-theme-flip],[data-lang-toggle],[data-serif],a[href^='#']"); if (!el) return;
    if (el.hasAttribute("data-theme-flip")) { const dark = P.state.theme === "dark" || (P.state.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches); P.setTheme(dark ? "light" : "dark"); render(); return; }
    if (el.hasAttribute("data-lang-toggle")) { nav(() => { P.setLang(P.state.lang === "zh" ? "en" : "zh"); render(); }); return; }
    if (el.hasAttribute("data-serif")) { P.store.set("proto-serif", P.store.get("proto-serif") === "1" ? "0" : "1"); render(); return; }
    const target = el.dataset.go || (["#home", "#story", "#policy"].includes(el.getAttribute("href")) ? el.getAttribute("href").slice(1) : null);
    if (target) { e.preventDefault(); nav(() => { P.go(target); render(); scrollTo(0, 0); }); }
  });
  document.addEventListener("keydown", (e) => { if (P.state.screen === "story" && (e.key === "j" || e.key === "k")) scrollBy({ top: e.key === "j" ? 320 : -320, behavior: P.reduced ? "auto" : "smooth" }); });
  const bar = document.querySelector(".progress");
  addEventListener("scroll", () => { const max = document.documentElement.scrollHeight - innerHeight; bar.style.setProperty("--p", P.state.screen === "story" && max > 0 ? (scrollY / max).toFixed(3) : 0); }, { passive: true });
  P.applyTheme(); render();
})();
</script>
</body>
</html>
