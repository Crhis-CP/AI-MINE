<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI矿策 · 方向 B 矿脉</title>
<style>
/* Direction B "Lode": a dark-first market desk. A live price band runs under the header, the centre column is a dense
   signal feed, and every story shows its sources converging into one event. Copper + lepidolite (lithium mica) lilac. */
@font-face { font-family: "Archivo"; src: url("../shared/fonts/Archivo_400Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Archivo"; src: url("../shared/fonts/Archivo_600SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Archivo"; src: url("../shared/fonts/Archivo_800ExtraBold.woff2") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("../shared/fonts/JetBrainsMono_400Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("../shared/fonts/JetBrainsMono_500Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }

:root {
  /* dark first: shaft graphite, molten copper, lepidolite lilac */
  --bg: #0E1114; --surface: #151A1F; --raised: #1C2228; --ink: #E9ECEF; --muted: #97A1AC; --line: #262D35;
  --copper: #EDA06A; --copper-fill: #D9783F; --lilac: #B4AAFF; --lilac-fill: #8B7CF6; --hi: #FF8A6B; --lo: #6E7883; --focus: #8FB8FF;
  --glow: rgb(217 120 63 / .28);
  --sans: "Archivo", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --serif: "Songti SC", "Noto Serif SC", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F4F6; --surface: #FFFFFF; --raised: #EEF0F3; --ink: #10141A; --muted: #535D68; --line: #DADFE5;
  --copper: #A24C17; --copper-fill: #D9783F; --lilac: #5442C8; --lilac-fill: #7C6CF0; --hi: #BF331A; --lo: #8A939C; --focus: #2A5BD7; --glow: rgb(217 120 63 / .18); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F3F4F6; --surface: #FFFFFF; --raised: #EEF0F3; --ink: #10141A; --muted: #535D68; --line: #DADFE5;
  --copper: #A24C17; --copper-fill: #D9783F; --lilac: #5442C8; --lilac-fill: #7C6CF0; --hi: #BF331A; --lo: #8A939C; --focus: #2A5BD7; --glow: rgb(217 120 63 / .18); color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; } button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 60; } .skip:focus { left: 8px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* header + ticker */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; padding: 10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand b { font-weight: 800; font-size: 18px; letter-spacing: .01em; }
.search { flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 16px; }
.search kbd { margin-left: auto; font: 500 11px/1 var(--mono); border: 1px solid var(--line); padding: 3px 6px; border-radius: 4px; }
.tools { display: flex; gap: 8px; }
.tbtn { min-width: 44px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 12px/1 var(--sans); letter-spacing: .04em; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.ticker { position: relative; overflow: hidden; border-top: 1px solid var(--line); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker ul { display: flex; gap: 0; margin: 0; padding: 0; list-style: none; width: max-content; animation: tick 48s linear infinite; }
.ticker:hover ul, .ticker:focus-within ul { animation-play-state: paused; }
@keyframes tick { to { transform: translateX(-50%); } }
.ticker li { display: flex; align-items: center; gap: 10px; padding: 8px 22px; border-right: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.ticker .sym { font: 500 12px/1 var(--mono); color: var(--muted); }
.ticker .v { font: 500 13px/1 var(--mono); }
.ticker .c { font: 500 12px/1 var(--mono); }
.ticker svg { width: 48px; height: 16px; }
.up { color: var(--hi); } .down { color: var(--muted); }
.ticker .note { color: var(--muted); font-size: 11px; }

/* layout */
.wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr) 320px; gap: 28px; padding: 22px max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left)); max-width: 1440px; margin: 0 auto; }
.wrap.read { grid-template-columns: 200px minmax(0, 1fr) 300px; }
.side-nav { position: sticky; top: 112px; align-self: start; display: grid; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 14px; }
.side-nav a:hover { color: var(--ink); background: var(--surface); }
.side-nav a[aria-current="page"] { color: var(--ink); background: linear-gradient(90deg, color-mix(in oklab, var(--copper-fill) 22%, transparent), transparent); font-weight: 600; }
.side-nav svg { width: 18px; height: 18px; }
.side-nav h2 { font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 16px 12px 6px; }

.hd { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
.hd h1 { font-size: 26px; font-weight: 800; letter-spacing: .01em; margin: 0; }
.hd span { color: var(--muted); font-size: 13px; }

/* signal hero */
.signal { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; margin-bottom: 20px; }
.hero { position: relative; display: grid; gap: 10px; padding: 18px; border-radius: 16px; text-decoration: none; overflow: hidden;
  background: radial-gradient(120% 100% at 100% 0%, color-mix(in oklab, var(--lilac-fill) 22%, transparent), transparent 60%), radial-gradient(90% 90% at 0% 100%, color-mix(in oklab, var(--copper-fill) 22%, transparent), transparent 60%), var(--surface);
  border: 1px solid var(--line); }
.hero h2 { font-size: 21px; line-height: 1.4; margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.conv-svg { width: 100%; height: auto; display: block; }
.mini .conv-svg { height: 26px; width: auto; max-width: 100%; justify-self: start; }
.conv-svg path { fill: none; stroke: var(--copper-fill); stroke-width: 1.5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) forwards; animation-delay: var(--d, 0s); opacity: .9; }
.conv-svg path.add { stroke: var(--lilac-fill); }
.conv-svg circle.src { fill: var(--raised); stroke: var(--muted); stroke-width: 1.2; }
.conv-svg circle.src.add { stroke: var(--lilac-fill); }
.conv-svg circle.node { fill: var(--copper-fill); filter: drop-shadow(0 0 8px var(--glow)); }
.conv-svg text { font: 500 10px/1 var(--mono); fill: var(--muted); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { display: grid; gap: 8px; align-content: space-between; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .2s, transform .25s var(--ease); }
.mini:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--copper-fill) 50%, var(--line)); }
.mini .k { font: 500 11px/1 var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
.mini .t { font-size: 14px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* facets */
.ftabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.ftabs button { border: 0; background: none; min-height: 42px; padding: 0 14px; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.ftabs button[aria-selected="true"] { color: var(--ink); border-color: var(--copper-fill); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: transparent; background: linear-gradient(90deg, var(--copper-fill), var(--lilac-fill)); color: #0E1114; font-weight: 600; }

/* feed rows */
.rows { display: grid; gap: 8px; }
.row { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); animation: in .5s var(--ease) both; animation-delay: var(--d, 0s); }
@keyframes in { from { opacity: 0; transform: translateY(10px) scale(.99); } }
.row::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: linear-gradient(120deg, var(--copper-fill), var(--lilac-fill)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .25s; pointer-events: none; }
.row:hover::before { opacity: 1; } .row:hover { box-shadow: 0 10px 30px -18px var(--glow); }
.when { display: grid; gap: 8px; align-content: start; justify-items: start; }
.when time { font: 500 13px/1 var(--mono); color: var(--muted); }
.meter { display: flex; gap: 2px; } .meter i { width: 4px; height: 14px; border-radius: 1px; background: var(--line); }
.meter.hi i.on { background: var(--hi); } .meter.mid i.on { background: var(--copper-fill); } .meter.lo i.on { background: var(--lo); }
.score { font: 600 15px/1 var(--mono); }
.score.hi { color: var(--hi); } .score.mid { color: var(--copper); } .score.lo { color: var(--muted); }
.row h3 { margin: 0 0 4px; font-size: 17px; line-height: 1.45; text-wrap: balance; }
.row h3 a { text-decoration: none; } .row h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.orig { display: block; font: 500 10px/1.4 var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.row p { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.pill { padding: 3px 8px; border-radius: 6px; background: var(--raised); color: var(--ink); }
.pill.pick { background: color-mix(in oklab, var(--lilac-fill) 22%, transparent); color: var(--lilac); font-weight: 600; }
.srcdots { display: inline-flex; gap: 3px; align-items: center; }
.srcdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .6; }
.srcdots i.add { background: var(--lilac-fill); opacity: 1; }
.tags a { margin-left: auto; text-decoration: none; color: var(--copper); font-weight: 600; min-height: 28px; display: inline-flex; align-items: center; }

/* right rail */
.rail { display: grid; gap: 16px; align-content: start; position: sticky; top: 112px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.box h2 { font-size: 14px; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.box h2 .live { width: 8px; height: 8px; border-radius: 50%; background: var(--lilac-fill); box-shadow: 0 0 0 0 var(--lilac-fill); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.box .hint { color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
.radar { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.radar li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 10px 12px; border-radius: 12px; background: var(--raised); font-size: 14px; }
.radar .cd { grid-row: span 2; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--bg); font: 600 16px/1 var(--mono); color: var(--copper); }
.radar .cd small { display: block; font: 500 9px/1 var(--mono); color: var(--muted); margin-top: 3px; }
.radar .m { font: 500 11px/1.4 var(--mono); color: var(--muted); }
.hotlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: h; }
.hotlist li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 13px; line-height: 1.45; counter-increment: h; }
.hotlist li::before { content: counter(h); font: 600 13px/1.45 var(--mono); color: var(--copper); }
.hotlist .b { display: block; height: 3px; margin-top: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--copper-fill), var(--lilac-fill)); width: var(--w); }
.foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; margin-top: 12px; }
.foot strong { color: var(--ink); }

/* story */
.progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 50; background: linear-gradient(90deg, var(--copper-fill), var(--lilac-fill)); transform-origin: left; transform: scaleX(var(--p, 0)); }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; color: var(--muted); text-decoration: none; font-size: 14px; }
.shead { display: grid; gap: 12px; padding: 20px; border-radius: 18px; border: 1px solid var(--line); margin-bottom: 26px;
  background: radial-gradient(80% 120% at 100% 0%, color-mix(in oklab, var(--lilac-fill) 18%, transparent), transparent 60%), var(--surface); }
.shead h1 { margin: 0; font-size: 30px; line-height: 1.35; font-weight: 800; text-wrap: balance; view-transition-name: lead-title; }
.prose { max-width: 37em; font-size: 17px; line-height: 1.85; }
.prose.serif { font-family: var(--serif); }
.prose h2 { font-size: 17px; margin: 34px 0 12px; font-family: var(--sans); }
.lbl { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--lilac); }
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: 15px; line-height: 1.6; }
.chain li { position: relative; padding: 0 0 18px 26px; }
.chain li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -8px; width: 2px; background: var(--line); }
.chain li:last-child::before { display: none; }
.chain li::after { content: ""; position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--muted); }
.chain li.added::after { border-color: var(--lilac-fill); background: var(--lilac-fill); box-shadow: 0 0 12px var(--lilac-fill); }
.chain .d { font: 500 12px/1 var(--mono); color: var(--muted); display: block; margin-bottom: 4px; }
.chain .k { color: var(--lilac); font-size: 12px; font-weight: 600; margin-left: 6px; }
table.src { width: 100%; border-collapse: collapse; font-size: 14px; font-family: var(--sans); }
table.src th, table.src td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.src th { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
table.src .added { color: var(--lilac); font-weight: 600; }
.cta { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; font: 600 15px/1 var(--sans); color: #0E1114; background: linear-gradient(90deg, var(--copper-fill), var(--lilac-fill)); }
.ghost { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 14px; }
.ainote { font-size: 13px; color: var(--muted); border-left: 2px solid var(--lilac-fill); padding: 2px 0 2px 12px; margin: 24px 0; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14px; }
.toc a { display: block; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); } .toc a:hover { background: var(--raised); color: var(--ink); }

/* policy */
.pipeline { list-style: none; margin: 18px 0 6px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.pipeline::before { content: ""; position: absolute; left: 10%; right: 10%; top: 13px; height: 2px; background: linear-gradient(90deg, var(--copper-fill), var(--lilac-fill)); transform-origin: left; animation: grow 1.2s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.pipeline li { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; padding: 0 6px; }
.pipeline .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--copper-fill); z-index: 1; }
.pipeline .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--copper-fill); }
.pipeline .cur .dot { border-color: var(--lilac-fill); box-shadow: 0 0 0 6px color-mix(in oklab, var(--lilac-fill) 20%, transparent), 0 0 20px var(--lilac-fill); }
.pipeline .cur .dot::after { background: var(--lilac-fill); }
.pipeline .d { font: 500 12px/1 var(--mono); color: var(--muted); }
.pipeline .l { font-size: 13px; line-height: 1.45; }
.pipeline .cur .l { font-weight: 700; color: var(--lilac); }
.state { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: color-mix(in oklab, var(--lilac-fill) 18%, transparent); color: var(--lilac); font-weight: 600; font-size: 13px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
.kv div { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.kv dt { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; } .kv dd { margin: 0; font-weight: 600; }
.cmpwrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); }
.cmp { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; line-height: 1.65; background: var(--surface); }
.cmp th, .cmp td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.cmp thead th { font: 600 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--raised); }
.cmp tr:last-child td { border-bottom: 0; }
.cmp td:first-child { font-weight: 700; width: 22%; }
.cmp .add { color: var(--ink); box-shadow: inset 3px 0 0 var(--lilac-fill); padding-left: 12px; display: block; }
.disc { margin-top: 18px; display: grid; gap: 6px; padding: 14px 16px; border-radius: 14px; border: 1px dashed color-mix(in oklab, var(--lilac-fill) 50%, var(--line)); font-size: 14px; }

.proto { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40; display: flex; gap: 4px; align-items: center; padding: 5px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-size: 12px; box-shadow: 0 12px 30px -10px rgb(0 0 0 / .5); }
.proto span { padding: 0 8px; color: var(--muted); }
.proto button { border: 0; background: transparent; min-height: 32px; padding: 0 10px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.proto button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.tabbar { display: none; }
@media (max-width: 1180px) { .wrap, .wrap.read { grid-template-columns: 180px minmax(0, 1fr); } .rail { grid-column: 2; position: static; grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .wrap, .wrap.read { grid-template-columns: minmax(0, 1fr); padding: 16px max(16px, env(safe-area-inset-right)) 100px max(16px, env(safe-area-inset-left)); }
  .side-nav { display: none; } .rail { grid-column: auto; grid-template-columns: minmax(0, 1fr); }
  .search { display: none; } .bar { padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); } .tools { margin-left: auto; }
  .signal { grid-template-columns: minmax(0, 1fr); } .minis { grid-auto-flow: column; grid-auto-columns: 72%; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; }
  .mini { scroll-snap-align: start; }
  .row { grid-template-columns: 46px minmax(0, 1fr); padding: 12px; gap: 10px; } .meter { display: none; }
  .hd h1 { font-size: 22px; } .shead h1 { font-size: 23px; }
  .pipeline { grid-template-columns: minmax(0, 1fr); gap: 14px; } .pipeline::before { left: 13px; right: auto; top: 14px; bottom: 14px; width: 2px; height: auto; transform-origin: top; }
  .pipeline li { grid-template-columns: 28px 86px 1fr; justify-items: start; text-align: left; align-items: center; padding: 0; }
  .kv { grid-template-columns: 1fr 1fr; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in oklab, var(--surface) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; min-height: 48px; padding-top: 6px; font-size: 11px; text-decoration: none; color: var(--muted); }
  .tabbar a[aria-current="page"] { color: var(--copper); font-weight: 600; }
  .tabbar svg { width: 20px; height: 20px; }
  .proto { bottom: calc(76px + env(safe-area-inset-bottom)); } .proto span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .conv-svg path { stroke-dashoffset: 0; }
  .ticker { overflow-x: auto; }
}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="progress" aria-hidden="true"></div>
<div id="root"></div>
<script src="../shared/demo.js"></script>
<script>
(() => {
  const P = Proto, D = DEMO;
  const I = {
    picks: '<path d="M4 13l4-4 4 4 8-8M4 19h16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    all: '<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    hot: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
    daily: '<rect x="5" y="4" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 9h8M8 13h8M8 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    policy: '<path d="M6 3h9l3 3v15H6z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M9 12h6M9 16h6M9 8h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    metals: '<path d="M3 17l5-5 4 3 9-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    topics: '<path d="M4 7l8-4 8 4-8 4zM4 12l8 4 8-4M4 17l8 4 8-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
    saved: '<path d="M7 4h10v16l-5-4-5 4z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
    me: '<circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6" stroke="currentColor" stroke-width="1.8" fill="none"/>',
    search: '<circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    moon: '<path d="M19 14A8 8 0 0 1 10 5a7 7 0 1 0 9 9z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
    sun: '<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
  };
  const svg = (k, s = 24) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true">${I[k]}</svg>`;
  const mark = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bg-g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#D9783F"/><stop offset="1" stop-color="#8B7CF6"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="#11161B"/><path d="M5 51 L20 41" stroke="url(#bg-g)" stroke-width="3" stroke-linecap="round"/><path d="M44 23 L59 13" stroke="url(#bg-g)" stroke-width="3" stroke-linecap="round"/><path d="M32 7 L43 19 L41 45 L32 57 L23 45 L21 19 Z" fill="#D9783F"/><path d="M32 7 L43 19 L41 45 L32 57 Z" fill="#8B7CF6"/><path d="M32 7 L43 19 L32 24 L21 19 Z" fill="#F1B183"/><path d="M32 24 L32 57" stroke="#11161B" stroke-opacity=".25" stroke-width="1"/></svg>`;
  const t = () => P.t();

  function top(screen) {
    const tt = t(), dark = P.state.theme === "dark" || (P.state.theme === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
    const items = D.prices.map((p) => `<li><span>${P.pick(p.metal)}</span><span class="sym">${p.sym}</span><span class="v">${p.value}</span><svg viewBox="0 0 48 16" aria-hidden="true"><polyline points="${P.spark(p.spark, 48, 14)}" fill="none" stroke="${p.change >= 0 ? "var(--hi)" : "var(--muted)"}" stroke-width="1.4"/></svg><span class="c ${p.change >= 0 ? "up" : "down"}">${p.change >= 0 ? "+" : "−"}${Math.abs(p.change).toFixed(1)}%</span><span class="note">${p.unit}</span></li>`).join("");
    return `<header class="top"><div class="bar">
      <a class="brand" href="#home">${mark}<b>${tt.brand}</b></a>
      <div class="search" role="search">${svg("search", 16)}<span>${tt.search}</span><kbd>/</kbd></div>
      <div class="tools"><button class="tbtn" type="button" data-theme-flip aria-label="${dark ? tt.theme.light : tt.theme.dark}">${svg(dark ? "sun" : "moon", 18)}</button>
      <button class="tbtn" type="button" data-lang-toggle aria-label="${tt.langLabel}">${tt.lang}</button></div></div>
      <div class="ticker" tabindex="0" aria-label="${tt.market} · ${tt.marketHint}"><ul>${items}<li class="note">${tt.quoteDate} ${D.quoteDate} · ${tt.marketHint}</li>${items}<li class="note">${tt.quoteDate} ${D.quoteDate} · ${tt.marketHint}</li></ul></div>
    </header>`;
  }
  function sideNav(screen) {
    const n = t().nav;
    const a = (k, ico, href, cur) => `<a href="${href}" ${cur ? 'aria-current="page"' : ""}>${svg(ico, 18)}<span>${n[k]}</span></a>`;
    return `<nav class="side-nav" aria-label="${P.state.lang === "zh" ? "主导航" : "Main"}">
      ${a("picks", "picks", "#home", screen !== "policy")}${a("all", "all", "#home")}${a("hot", "hot", "#home")}${a("daily", "daily", "#home")}${a("policy", "policy", "#policy", screen === "policy")}${a("topics", "topics", "#home")}${a("metals", "metals", "#home")}${a("saved", "saved", "#home")}
      <h2>${n.more}</h2>${a("agent", "all", "#home")}${a("about", "all", "#home")}${a("changelog", "all", "#home")}${a("feedback", "all", "#home")}</nav>`;
  }
  function frame(inner, screen, cls = "") {
    const tt = t();
    return `${top(screen)}<div class="wrap ${cls}">${sideNav(screen)}${inner}
      <footer class="foot"><strong>${tt.brand}</strong><span>${P.pick(D.updated)}</span><span>${tt.footer.attribution}</span><a href="#home">${tt.footer.takedown}</a><span>${tt.footer.demo}</span></footer></div>
      <nav class="tabbar" aria-label="tabs"><a href="#home" ${screen !== "policy" ? 'aria-current="page"' : ""}>${svg("picks", 20)}${tt.tabs.picks}</a><a href="#home">${svg("hot", 20)}${tt.tabs.hot}</a><a href="#policy" ${screen === "policy" ? 'aria-current="page"' : ""}>${svg("policy", 20)}${tt.nav.policy}</a><a href="#home">${svg("metals", 20)}${tt.tabs.metals}</a><a href="#home">${svg("me", 20)}${tt.tabs.me}</a></nav>
      <div class="proto" role="group" aria-label="prototype screens"><span>${tt.footer.demo}</span>${["home", "story", "policy"].map((s) => `<button type="button" data-go="${s}" aria-pressed="${screen === s}">${tt.screens[s]}</button>`).join("")}</div>`;
  }
  function conv(n, added, w = 520, h = 86, labels) {
    const nodeX = w - 40, nodeY = h / 2;
    let out = "";
    for (let i = 0; i < n; i++) {
      const y = n === 1 ? nodeY : 10 + i * ((h - 20) / (n - 1));
      const cls = i < added ? "add" : "";
      out += `<path class="${cls}" pathLength="1" d="M24 ${y} C ${w * 0.45} ${y}, ${w * 0.55} ${nodeY}, ${nodeX - 10} ${nodeY}" style="--d:${0.1 + i * 0.12}s"/>`;
      out += `<circle class="src ${cls}" cx="24" cy="${y}" r="5"/>`;
      if (labels) out += `<text x="36" y="${y + 3}">${labels[i] || ""}</text>`;
    }
    out += `<circle class="node" cx="${nodeX}" cy="${nodeY}" r="9"/>`;
    return `<svg class="conv-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out}</svg>`;
  }
  function titleOf(it) { return P.itemTitle(it); }
  function scoreHtml(it) {
    const tier = P.scoreTier(it.score); if (!tier) return "";
    const on = Math.round(it.score / 10);
    return `<span class="score ${tier}" title="${t().score} ${it.score}/100" aria-label="${t().score} ${it.score}">${it.score}</span><span class="meter ${tier}" aria-hidden="true">${Array.from({ length: 10 }, (_, k) => `<i class="${k < on ? "on" : ""}"></i>`).join("")}</span>`;
  }

  function home() {
    const tt = t(), L = P.state.lang, picks = D.items.filter((i) => i.pick);
    const h = picks[0], ht = titleOf(h);
    const minis = picks.slice(1, 5).map((it, i) => { const x = titleOf(it); return `<a class="mini" href="#story"><span class="k"><span>${String(i + 2).padStart(2, "0")} · ${P.pick(it.commodity)}</span><span>${it.score}</span></span><span class="t" lang="${x.lang}">${P.esc(x.text)}</span>${conv(it.sources, it.added, 160, 30)}</a>`; }).join("");
    const rows = D.items.map((it, i) => {
      const x = titleOf(it);
      const dots = Array.from({ length: it.sources }, (_, k) => `<i class="${k < it.added ? "add" : ""}"></i>`).join("");
      return `<article class="row" style="--d:${0.05 * i}s" data-card-key="${it.id}">
        <div class="when"><time>${it.time}</time>${scoreHtml(it)}</div>
        <div><h3>${x.original ? `<span class="orig">${tt.origTitle} · ${it.lang}</span>` : ""}<a href="#story" lang="${x.lang}">${P.esc(x.text)}</a></h3>
          <p lang="zh-CN">${P.esc(it.summary)}</p>
          <div class="tags">${it.pick ? `<span class="pill pick">${tt.pick}</span>` : ""}<span class="pill">${P.pick(it.commodity)}</span><span class="pill">${P.pick(it.chain)}</span><span>${P.pick(it.place)}</span>
            <span class="srcdots" title="${tt.sources(it.sources)}">${dots}</span><span>${tt.sources(it.sources)}${it.added ? " · " + tt.newFacts(it.added) : ""}</span><a href="#story">${tt.original} ↗</a></div></div></article>`;
    }).join("");
    const radar = D.policy.calendar.map((c, i) => { const days = [6, 27, 31, 58][i]; return `<li><span class="cd">${days}<small>${L === "zh" ? "天" : "days"}</small></span><span>${P.pick(c)}</span><span class="m">${c.date} · ${c.tag}</span></li>`; }).join("");
    const hot = D.items.slice().sort((a, b) => b.sources - a.sources).slice(0, 5).map((it) => `<li><span><span lang="${titleOf(it).lang}">${P.esc(titleOf(it).text)}</span><span class="b" style="--w:${it.sources * 13}%"></span></span></li>`).join("");
    return frame(`<main id="main" tabindex="-1">
      <div class="hd"><h1>${tt.nav.picks}</h1><span>${P.pick(D.today)} · ${P.pick(D.updated)}</span></div>
      <section class="signal" aria-label="${tt.essentials}">
        <a class="hero" href="#story"><span class="lbl">${tt.essentials} · 01</span>
          <h2 lang="${ht.lang}">${P.esc(ht.text)}</h2><p lang="zh-CN">${P.esc(h.summary)}</p>
          ${conv(h.sources, h.added, 520, 70, h.sources === 4 ? ["ES", "ES", "EN", "ZH"] : null)}
          <div class="tags"><span class="pill pick">${tt.pick}</span><span class="pill">${P.pick(h.commodity)}</span><span>${P.pick(h.place)}</span><span>${tt.sources(h.sources)} · ${tt.newFacts(h.added)}</span><span class="score hi" style="margin-left:auto">${tt.score} ${h.score}</span></div></a>
        <div class="minis">${minis}</div>
      </section>
      <div class="ftabs" role="tablist" aria-label="filters">${["commodity", "country", "chain", "company"].map((k, i) => `<button role="tab" type="button" aria-selected="${i === 0}">${tt.facets[k]}</button>`).join("")}</div>
      <div class="chips" role="group" aria-label="${tt.facets.commodity}"><button class="chip" type="button" aria-pressed="true">${tt.facets.all}</button>${D.facets.commodity.map((f) => `<button class="chip" type="button" aria-pressed="false">${P.pick(f)}</button>`).join("")}</div>
      <div class="rows">${rows}</div>
    </main>
    <aside class="rail" aria-label="${tt.radar}">
      <section class="box"><h2><span class="live" aria-hidden="true"></span>${tt.radar}</h2><p class="hint">${tt.radarHint}</p><ul class="radar">${radar}</ul></section>
      <section class="box"><h2>${tt.nav.hot}</h2><p class="hint">${L === "zh" ? "按独立来源数排序" : "Ranked by independent sources"}</p><ol class="hotlist">${hot}</ol></section>
    </aside>`, "home");
  }

  function story() {
    const tt = t(), ts = tt.story, s = D.story, it = D.items.find((i) => i.id === s.id), x = titleOf(it);
    const serif = P.store.get("proto-serif") === "1";
    return frame(`<main id="main" tabindex="-1">
      <a class="back" href="#home">← ${ts.back}</a>
      <header class="shead"><div class="tags"><span class="pill pick">${tt.pick}</span><span class="pill">${P.pick(it.commodity)}</span><span class="pill">${P.pick(it.chain)}</span><span>${P.pick(it.place)} · <span class="mono">${it.coord}</span></span><span class="score hi" style="margin-left:auto">${tt.score} ${it.score}</span></div>
        ${x.original ? `<span class="orig">${tt.origTitle} · ${it.lang}</span>` : ""}<h1 lang="${x.lang}">${P.esc(x.text)}</h1>
        ${conv(4, 2, 640, 96, s.reports.map((r) => `${r.lang} · ${P.pick(r.name)}`))}
        <div class="tags"><span>${tt.sources(it.sources)} · ${tt.newFacts(it.added)}</span></div></header>
      <div class="prose ${serif ? "serif" : ""}">
        <span class="lbl" id="lead">${tt.summary}</span>${s.lead.map((p) => `<p lang="zh-CN">${P.esc(p)}</p>`).join("")}
        <h2 id="progress">${ts.progress}</h2><ol class="chain">${s.timeline.map((e) => `<li class="${e.kind}"><span class="d">${e.date}</span>${P.pick(e)}${e.kind === "added" ? `<span class="k">${ts.added}</span>` : ""}</li>`).join("")}</ol>
        <h2 id="reports">${ts.reports}</h2><div style="overflow-x:auto"><table class="src"><thead><tr><th>${P.state.lang === "zh" ? "来源" : "Source"}</th><th>${P.state.lang === "zh" ? "语言" : "Lang"}</th><th>${P.state.lang === "zh" ? "时间" : "Time"}</th><th></th></tr></thead><tbody>${s.reports.map((r) => `<tr><td>${P.pick(r.name)}</td><td class="mono">${r.lang}</td><td class="mono">${r.time}</td><td class="${r.kind}">${ts[r.kind]}</td></tr>`).join("")}</tbody></table></div>
        <p class="ainote">${P.state.lang === "zh" ? "中文导读由 AI 辅助生成，可能有误，以原文为准。" : "The Chinese summary is AI-assisted and may contain errors. The source prevails."}</p>
        <p id="orig"><a class="cta" href="#story">${ts.readOriginal} ↗</a></p>
      </div></main>
    <aside class="rail"><section class="box"><h2>${ts.toc}</h2><ul class="toc" style="margin-top:10px"><li><a href="#lead">${tt.summary}</a></li><li><a href="#progress">${ts.progress}</a></li><li><a href="#reports">${ts.reports}</a></li><li><a href="#orig">${tt.original}</a></li></ul></section>
      <section class="box"><h2>${ts.facts}</h2><ul class="radar" style="margin-top:12px">${s.facts.map((f, i) => `<li><span class="cd">${[6, 17, 31][i]}<small>${P.state.lang === "zh" ? "天" : "days"}</small></span><span>${P.pick(f)}</span><span class="m">${f.date}</span></li>`).join("")}</ul></section>
      <section class="box"><button class="ghost" type="button" data-serif aria-pressed="${serif}">${ts.serif}</button><p class="hint" style="margin:10px 0 0">${ts.keys}</p></section></aside>`, "story", "read");
  }

  function policy() {
    const tt = t(), tp = tt.policy, d = D.policy, L = P.state.lang;
    return frame(`<main id="main" tabindex="-1">
      <a class="back" href="#home">${tp.crumb}</a>
      <header class="shead"><span class="state">● ${tp.state}${L === "zh" ? "：" : ": "}${tp.inForce}</span>
        <h1 ${L === "zh" ? 'lang="zh-CN"' : ""}>${L === "zh" ? d.title : d.titleEn}</h1>${L === "en" ? `<span class="orig" lang="zh-CN" style="font-size:13px;text-transform:none;letter-spacing:0">${d.title}</span>` : ""}
        <ol class="pipeline" aria-label="${tp.lifecycle}">${d.lifecycle.map((s) => `<li class="${s.current ? "cur" : ""}"><span class="dot" aria-hidden="true"></span><span class="d">${s.date}</span><span class="l">${P.pick(s)}</span></li>`).join("")}</ol></header>
      <dl class="kv">${["type", "issuer", "number", "promulgated", "effective", "structure"].map((k) => `<div><dt>${tp.meta[k]}</dt><dd>${P.pick(d.meta[k])}</dd></div>`).join("")}</dl>
      <div class="hd"><h1 style="font-size:18px">${tp.points}</h1><span>${tp.pointsNote}</span></div>
      <div class="cmpwrap" role="region" tabindex="0" aria-label="${tp.points}"><table class="cmp"><thead><tr><th></th><th>${tp.law}</th><th>${tp.reg}</th></tr></thead><tbody>${d.points.map((p) => `<tr><td>${P.pick(p.topic)}</td><td>${P.pick(p.law)}</td><td><span class="add">${P.pick(p.reg)}</span></td></tr>`).join("")}</tbody></table></div>
      <div class="disc"><strong>${tp.disclaimer}</strong><span>${tp.source}</span><a href="#policy">${tp.report}</a></div>
    </main>
    <aside class="rail"><section class="box"><h2><span class="live" aria-hidden="true"></span>${tp.calendar}</h2><p class="hint">${tt.radarHint}</p><ul class="radar">${d.calendar.map((c, i) => `<li><span class="cd">${[6, 27, 31, 58][i]}<small>${L === "zh" ? "天" : "days"}</small></span><span>${P.pick(c)}</span><span class="m">${c.date} · ${c.tag}</span></li>`).join("")}</ul></section>
      <section class="box"><h2>${tp.versions}</h2><ul class="toc" style="margin-top:10px"><li><a href="#policy">06-15 · ${L === "zh" ? "施行版本（当前）" : "In-force version (current)"}</a></li><li><a href="#policy">05-20 · ${L === "zh" ? "首次收录" : "First recorded"}</a></li></ul></section></aside>`, "policy");
  }

  const root = document.getElementById("root");
  function render() { const s = P.state.screen; root.innerHTML = s === "story" ? story() : s === "policy" ? policy() : home(); document.documentElement.lang = P.state.lang === "zh" ? "zh-CN" : "en"; }
  const nav = (fn) => (document.startViewTransition && !P.reduced ? document.startViewTransition(fn) : fn());
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-go],[data-theme-flip],[data-lang-toggle],[data-serif],a[href^='#']"); if (!el) return;
    if (el.hasAttribute("data-theme-flip")) { const dark = P.state.theme === "dark" || (P.state.theme === "system" && !matchMedia("(prefers-color-scheme: light)").matches); P.setTheme(dark ? "light" : "dark"); render(); return; }
    if (el.hasAttribute("data-lang-toggle")) { nav(() => { P.setLang(P.state.lang === "zh" ? "en" : "zh"); render(); }); return; }
    if (el.hasAttribute("data-serif")) { P.store.set("proto-serif", P.store.get("proto-serif") === "1" ? "0" : "1"); render(); return; }
    const target = el.dataset.go || (["#home", "#story", "#policy"].includes(el.getAttribute("href")) ? el.getAttribute("href").slice(1) : null);
    if (target) { e.preventDefault(); nav(() => { P.go(target); render(); scrollTo(0, 0); }); }
  });
  document.addEventListener("keydown", (e) => { if (P.state.screen === "story" && (e.key === "j" || e.key === "k")) scrollBy({ top: e.key === "j" ? 320 : -320, behavior: P.reduced ? "auto" : "smooth" }); });
  const bar = document.querySelector(".progress");
  addEventListener("scroll", () => { const max = document.documentElement.scrollHeight - innerHeight; bar.style.setProperty("--p", P.state.screen === "story" && max > 0 ? (scrollY / max).toFixed(3) : 0); }, { passive: true });
  P.applyTheme(); render();
})();
</script>
</body>
</html>
