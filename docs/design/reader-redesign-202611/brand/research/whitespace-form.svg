<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Noto Sans SC, sans-serif"><rect width="1200" height="560" fill="#F6F4EF"/><text x="90" y="40" font-size="20" font-weight="700" fill="#14161A">形状白地图：标识是字标还是图形，是几何还是有机曲线</text><rect x="120" y="70" width="1000" height="400" fill="none" stroke="#14161A" stroke-opacity=".25"/><text x="120" y="496" font-size="13" fill="#5d636c">字标为主</text><text x="1120" y="496" font-size="13" text-anchor="end" fill="#5d636c">图形为主</text><text x="106" y="470" font-size="13" text-anchor="end" fill="#5d636c">几何</text><text x="106" y="82" font-size="13" text-anchor="end" fill="#5d636c">有机曲线</text><circle cx="200" cy="398" r="9" fill="#14161A"/><text x="214" y="396" font-size="14" fill="#14161A">BHP</text><text x="214" y="413" font-size="11" fill="#5d636c">粗体字标</text><circle cx="420" cy="390" r="9" fill="#14161A"/><text x="434" y="388" font-size="14" fill="#14161A">力拓</text><text x="434" y="405" font-size="11" fill="#5d636c">红色色块 + 字标</text><circle cx="700" cy="414" r="9" fill="#14161A"/><text x="714" y="412" font-size="14" fill="#14161A">Kitco</text><text x="714" y="429" font-size="11" fill="#5d636c">梯形几何符号 + 字标</text><circle cx="740" cy="350" r="9" fill="#14161A"/><text x="754" y="348" font-size="14" fill="#14161A">Benchmark</text><text x="754" y="365" font-size="11" fill="#5d636c">四分之一圆、方块、点 + 字标</text><circle cx="720" cy="278" r="9" fill="#14161A"/><text x="734" y="276" font-size="14" fill="#14161A">淡水河谷</text><text x="734" y="293" font-size="11" fill="#5d636c">V 形符号 + 字标</text><circle cx="820" cy="206" r="9" fill="#14161A"/><text x="834" y="204" font-size="14" fill="#14161A">卡莫阿铜业</text><text x="834" y="221" font-size="11" fill="#5d636c">矿堆与“人”字笔意 + 字标</text><rect x="740" y="90" width="360" height="88" rx="10" fill="#A0442A" fill-opacity=".08" stroke="#A0442A" stroke-dasharray="6 4"/><text x="754" y="120" font-size="14" fill="#A0442A">空位：柔和曲线的抽象符号 + 定制中文字标</text><text x="90" y="535" font-size="12" fill="#5d636c">样本较小：矿业巨头取第 3 轮调研的公开说明，行业媒体只收能读到 SVG 的两家；中文同行多为小尺寸位图，形态未查看，没有标在图上。</text></svg>
