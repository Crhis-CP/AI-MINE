# docker compose up -d --build → public localhost:3000; private private.localhost:3000/admin
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy
name: amp

x-app: &app
  build: .
  image: ${APP_IMAGE:-amp-app}
  env_file: .env
  restart: unless-stopped
  networks: [default, db]
  environment: &app-env
    NODE_ENV: production
    AMP_RELEASE: ${AMP_RELEASE:-dev}
    DATABASE_URL: postgres://amp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，先运行 node scripts/init-env.ts}@db:5432/amp
    AMP_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    LOCAL_ROUTER_URL: http://web:3000
    ORIGINAL_POST_ADMISSION_ENABLED: ${ORIGINAL_POST_ADMISSION_ENABLED:-false}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # Pinned to a patch version and its multi-arch digest (T-0001); T-0005 moves to PostgreSQL 18.6 + pgvector.
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    networks: [db]
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，先运行 node scripts/init-env.ts}
      POSTGRES_DB: amp
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d amp"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the topics and demo sources, then exits.
  setup:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *app
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *app-env
      API_ROLE: api
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      PUBLIC_RATE_LIMIT_SECRET: ${PUBLIC_RATE_LIMIT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      PRIVATE_HOST: ${PRIVATE_HOST:-private.localhost}
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    environment:
      <<: *app-env
      AMP_BACKUP_DIR: /backups
    volumes:
      - data:/data
      - backups:/backups
      - price-relay-keys:/run/price-relay:ro
    command: ["node", "apps/worker/src/main.ts"]
    # Let the worker finish its in-flight backup and paid calls (470 s), then close the database.
    stop_grace_period: 480s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    build: .
    image: ${APP_IMAGE:-amp-app}
    restart: unless-stopped
    command: ["node", "apps/web/server.ts"]
    environment:
      NODE_ENV: production
      AMP_RELEASE: ${AMP_RELEASE:-dev}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_BASE_URL: http://api:3001
      PRIVATE_HOST: ${PRIVATE_HOST:-private.localhost}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Per-visitor limits and the CDN's client address (TASK-0583/0586): empty means off.
      RATE_LIMIT: ${RATE_LIMIT:-}
      RATE_LIMIT_PAGE: ${RATE_LIMIT_PAGE:-}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-}
      RATE_LIMIT_OBSERVE: ${RATE_LIMIT_OBSERVE:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      ORIGIN_SECRET_HEADER: ${ORIGIN_SECRET_HEADER:-}
      ORIGIN_ENFORCE: ${ORIGIN_ENFORCE:-}
      # Seconds a CDN or proxy may share a reader page's HTML (TASK-0672/0717): empty means 30, 0 turns it off.
      PAGE_CACHE_SECONDS: ${PAGE_CACHE_SECONDS:-}
      # Search-console ownership codes for the home page (TASK-0590): empty means none.
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      BAIDU_SITE_VERIFICATION: ${BAIDU_SITE_VERIFICATION:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: ["https"]
    command:
      - /bin/sh
      - -ec
      - |
        case "$$PRIVATE_HOST" in
          \[*\]) PRIVATE_HOSTNAME="$$PRIVATE_HOST" ;;
          *) PRIVATE_HOSTNAME="$${PRIVATE_HOST%:*}" ;;
        esac
        export PRIVATE_HOSTNAME
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      PRIVATE_HOST: ${PRIVATE_HOST:-private.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

networks:
  db:
    internal: true

volumes:
  price-relay-keys:
  db: {}
  data: {}
  backups: {}
  caddy: {}
